<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Quadrados Interativos</title>
  <style>
    .container {
      display: flex;
      gap: 20px;
    }

    .quadrado {
      width: 150px;
      height: 150px;
      background-color: white;
      border: 2px solid #000;
      transition: background-color 0.3s ease;
    }

    .quadrado:hover {
      background-color: yellow;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="quadrado"></div>
    <div class="quadrado"></div>
  </div>

</body>
</html>
